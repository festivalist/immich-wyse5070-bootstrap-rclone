services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    # /dev/dri wird fuer Hardware-Transcoding (Intel QuickSync) durchgereicht.
    # Bei Rechtefehlern auf renderD128 die Render-Gruppe des Hosts ergaenzen
    # (siehe Handbuch, QuickSync-Troubleshooting): group_add: ["<render-GID>"]
    devices:
      - /dev/dri:/dev/dri
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # Standard-Image nutzt CPU. /dev/dri wird hier bewusst NICHT durchgereicht,
    # da es ohne das "-openvino"-Image keinen Effekt haette.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
    # v3: Modell-Revision v2 wie im offiziellen v3-Compose-Template (Stand 11/2026).
    environment:
      MACHINE_LEARNING_MODEL_REVISION: 'v2'
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # v3: DB liegt auf HDD (/mnt/immich-data), daher offizielles HDD-Tuning.
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
